name = 六點輸入法 (6d-IME)
summary = 豪點輸入法 (6d-IME)
description = 豪點輸入法：以標準點字六鍵（fds jkl）或點字顯示器的點字鍵輸入。Ctrl+NVDA+7 切換一般輸入與點字鍵輸入，空白＋點456 可在台灣注音點字、縮點（調號併入第 7、8 點，實驗）、黑點點字(braille unicode)、電腦八點點字、UEB-G1、UEB-G2 間循環切換，空白＋點7 關閉，Ctrl+NVDA+8 設定循環項目。注音點字與縮點模式會自動切換到微軟注音。
author = "hurt<hurt.nzsmr@gmail.com>; Claude"
url = "https://class.kh.edu.tw/19061"
version = 1.7
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2

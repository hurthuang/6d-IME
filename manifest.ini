name = 六點輸入法 (6d-IME)
summary = 六點輸入點字
description = 以標準點字六鍵（fds jkl）輸入，Ctrl+NVDA+7 切換一般輸入與六點輸入，JKL + 空白鍵可在台灣注音點字、黑點點字(braille unicode)、電腦八點點字、UEB-G1、UEB-G2 間循環切換，Ctrl+NVDA+8 設定循環項目。

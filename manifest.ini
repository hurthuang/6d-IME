name = 六點輸入法 (6d-IME)
summary = "Haodian Six-Key Braille Input (6d-IME)"
description = "Type with the six braille keys (F D S J K L) or the braille keys of a braille display. Ctrl+NVDA+7 toggles braille key input; Space+dots 4-5-6 cycles Taiwanese bopomofo braille, contracted bopomofo (tones on dots 7 and 8, experimental), Unicode braille, computer 8-dot braille, UEB grade 1 and UEB grade 2; Space+dot 7 turns it off; Ctrl+NVDA+8 chooses the modes to cycle. Bopomofo modes switch to Microsoft Bopomofo automatically."
author = "hurt<hurt.nzsmr@gmail.com>; Claude"
url = "https://class.kh.edu.tw/19061"
version = 1.7
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
